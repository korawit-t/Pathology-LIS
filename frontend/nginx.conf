server {
    listen 80;

    # --- Security response headers for everything nginx serves directly ------
    # This config serves ONLY the SPA (HTML/JS/CSS/assets); the API is a
    # separate cross-origin backend (VITE_API_BASE_URL, e.g.
    # https://<host>:8000), which sets its own headers on its own responses.
    # These headers are therefore safe at the server level here — nginx never
    # proxies the API in this (on-prem) build, so they can't collide with the
    # backend's.
    #
    # `always` = send them on error responses (4xx/5xx) too, not just 2xx/3xx.
    add_header X-Frame-Options            "DENY"                              always;
    add_header X-Content-Type-Options     "nosniff"                           always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    # Ignored by browsers over plain HTTP and on bare-IP hosts; takes effect
    # once the site is reached via HTTPS on a real hostname.
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    # CSP: script-src is locked to 'self' (no inline scripts in the Vite
    # bundle) — that's the key XSS control. connect-src / img-src stay
    # scheme-open because the API and the login logo are served from the
    # cross-origin backend; tighten them to that exact origin
    # (e.g. "connect-src 'self' https://<host>:8000") if you want it stricter.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # สำคัญ: ส่งทุก route กลับไปที่ index.html
    }

    # จัดการ Error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
