# =============================================================================
# Production baseline.
#
# This file ships ZERO secrets and ZERO weak defaults. It reads three files:
#
#   .env           (repo root)  POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB /
#                               LIS_APP_PASSWORD — the database container's own
#                               credentials. Copy .env.example to start one.
#   backend/.env                everything the backend reads, DATABASE_URL and
#                               ENVIRONMENT included.
#   frontend/.env               VITE_API_BASE_URL, baked into the frontend build.
#
# Local development uses docker-compose.override.yml (auto-loaded by
# `docker compose up`) which provides safe-to-commit DEV defaults and
# re-enables the seed script. Production deploys MUST bypass the override:
#
#   # Production:
#   docker compose -f docker-compose.yml up -d --build
#
#   # First-time prod seed (one-shot, after the stack is up):
#   docker compose -f docker-compose.yml run --rm backend python seed_data.py
#
#   # Local development (auto-merges override.yml):
#   docker compose up -d --build
#
# Everything that differs between sites (ports, the WSI scanner folder, the
# project name) is read from the root .env, so this file never needs editing
# and `git pull` never conflicts with a local change to it.
# =============================================================================

# Container logs rotate instead of growing forever. Docker's default json-file
# driver keeps every line, and the backend's access log carries request URLs,
# HNs and patient-name searches included. Five 20 MB files per service are kept,
# about a week of a busy lab; `docker compose logs` reads them as usual.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # --- Database migrations (one-shot) ---
  # Runs `alembic upgrade head` as the database OWNER, then exits; the backend
  # starts only after it succeeds. Migrations need to create and alter tables,
  # which the least-privilege lis_app_rw role (init-db.sh) is not allowed to
  # do, so backend/.env can point DATABASE_URL at lis_app_rw while this
  # service keeps the owner account. The owner password stays in this
  # short-lived container and never reaches the long-running backend.
  #
  # The URL is assembled from the root .env, so POSTGRES_PASSWORD must be
  # URL-safe (letters and digits — `openssl rand -hex 24` gives one).
  migrate:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    logging: *logging
    depends_on:
      db:
        condition: service_healthy

  # --- Backend (FastAPI) ---
  backend:
    build: ./backend
    # SECRET_KEY, DATABASE_URL, ALLOWED_ORIGINS, ENVIRONMENT, etc. ENVIRONMENT
    # is deliberately NOT set here: a value in `environment:` would override
    # backend/.env, and a LAN install over plain HTTP has to run with
    # ENVIRONMENT=development (see backend/.env.example). Unset, the backend
    # itself defaults to production (fail-closed).
    #
    # Compose reads this file itself, and it expands `$NAME` inside values the
    # way a shell would: a password Pa$word9 reaches the backend as "Pa". A `$`
    # that is part of a value is written `$$` here (see backend/.env.example).
    env_file:
      - ./backend/.env
    container_name: pathology-backend
    restart: unless-stopped
    logging: *logging
    ports:
      # BACKEND_PORT in the root .env; frontend/.env's VITE_API_BASE_URL has
      # to name the same port.
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Every uploaded image and file (gross/cyto/microscopic photos, request
      # forms, consult PDFs, logos). The code writes to `uploads/` under
      # WORKDIR /app; without this volume they live in the container layer and
      # are lost whenever the container is recreated (e.g. `up --build`).
      # A named volume, not a host bind mount: the backend runs as uid 1001
      # and a bind-mounted host directory is root-owned on Linux.
      - uploads_data:/app/uploads
      # Whole-slide images, read in place from the folder the scanner writes
      # to. Set WSI_HOST_PATH in the root .env to that folder (an absolute
      # path), then give /wsi as the WSI Root Path in System Settings → WSI
      # Settings. Unset, an empty volume stands in and the viewer finds nothing.
      # Read-only: the viewer never writes to the scanner's folder.
      - ${WSI_HOST_PATH:-wsi_unset}:/wsi:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --- Frontend (React/Vite) ---
  # VITE_API_BASE_URL is read from frontend/.env at BUILD time (Vite bakes it
  # into the bundle; nginx never reads it), so the file is part of the build
  # context rather than an env_file here. Change it, then rebuild.
  frontend:
    build: ./frontend
    container_name: pathology-frontend
    restart: unless-stopped
    logging: *logging
    ports:
      # FRONTEND_PORT in the root .env; backend/.env's ALLOWED_ORIGINS has to
      # name the same port (http://<server-ip>:<port>).
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  # --- ฐานข้อมูล PostgreSQL ---
  db:
    # Pinned to the major version on purpose: minor releases are drop-in, but
    # a new major cannot read this data directory without pg_upgrade.
    image: postgres:15-alpine
    container_name: pathology-db
    restart: unless-stopped
    logging: *logging
    # 🔒 SECURITY: DB port is NOT published to the host in production.
    # The backend reaches it over the internal Docker network. The dev
    # override re-publishes 5432:5432 for local debugging.
    # 🔒 PRODUCTION: set these in the root .env (copy .env.example) before
    #   docker compose -f docker-compose.yml up -d --build
    # The dev override (docker-compose.override.yml) supplies safe dev defaults.
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Password for the least-privilege app role provisioned by init-db.sh.
      # Leave empty in dev (init-db.sh skips role creation gracefully).
      - LIS_APP_PASSWORD=${LIS_APP_PASSWORD:-}
    healthcheck:
      # $$ = evaluated inside the container, where the variables are set.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once on first volume creation to provision the lis_app_rw role.
      - ./backend/db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

# Compose names these <project>_postgres_data and so on, and the project name
# defaults to the folder this file is in: rename or move the folder and the
# next `up` starts on new, empty volumes. COMPOSE_PROJECT_NAME in the root .env
# fixes the name; see .env.example.
volumes:
  postgres_data:
  uploads_data:
  # Stand-in for WSI_HOST_PATH when no scanner folder is configured.
  wsi_unset:
