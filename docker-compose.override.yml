# =============================================================================
# Development override.
#
# Auto-merged with docker-compose.yml when you run `docker compose up`
# (Docker Compose loads docker-compose.override.yml automatically). Provides
# safe-to-commit dev defaults so a fresh clone needs only backend/.env:
#
#   git clone https://github.com/korawit-t/Pathology-LIS.git && cd Pathology-LIS
#   cp backend/.env.example backend/.env    # then set SECRET_KEY in it
#   docker compose up -d --build
#
# Production deploys MUST skip this file:
#   docker compose -f docker-compose.yml up -d --build
#
# What this override does (vs the production baseline):
#   - hardcodes a dev DB password / user / db name so no root .env is needed
#   - publishes the DB on port 5432 (DB_PORT in a root .env) so you can
#     connect a DB client from the host
#   - builds the frontend against http://localhost:8000 (BACKEND_PORT)
#   - re-runs seed_data.py on every backend start so the dev admin user,
#     templates, and reference data exist (idempotent — see seed_data.py)
#   - drops `restart: unless-stopped` so dev failures are visible
#   - sets EXPOSE_DOCS=true so /docs and /redoc are available in dev
#
# The schema comes from Alembic (the `migrate` service), as in production —
# not from create_tables.py, which leaves no alembic_version behind and so
# could never take a later migration. A dev database created by a version of
# this file before 3.1.0 has that problem (`migrate` fails with DuplicateTable
# or "type ... already exists"). Empty it once, then start again:
#   docker compose up -d db
#   docker compose exec db psql -U pathology_dev -d pathology_lis -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
#   docker compose up -d --build
# That deletes every row in the dev database and nothing else; uploads stay.
# It logs in as the dev account, which a production database does not have,
# so pointed at production it fails instead of deleting anything. Do NOT use
# `docker compose down -v` for this: it also deletes the uploads volume, and
# on a production server it would delete the real database and every upload.
#
# 🔒 NEVER copy these defaults into a production environment. The seeded
# admin uses `admin/admin1234` (marked as a temporary password — first
# login forces a change), but you still don't want this exposed.
# =============================================================================

services:
  migrate:
    environment:
      # The dev DB owner — matches the `db` service below.
      - DATABASE_URL=postgresql+psycopg2://pathology_dev:dev_password_change_me@db:5432/pathology_lis
    volumes:
      # Migrations from the working tree, not the ones baked into the image.
      - ./backend:/app

  backend:
    restart: "no"
    environment:
      # Dev DB connection — matches the `db` service below.
      - DATABASE_URL=postgresql+psycopg2://pathology_dev:dev_password_change_me@db:5432/pathology_lis
      - ENVIRONMENT=development
      # Swagger UI / ReDoc / the OpenAPI schema. Off by default everywhere
      # (fail-closed, see backend/.env.example); switched on here because a
      # browsable schema is the point of a dev stack. Production skips this
      # file, so it stays off there unless backend/.env asks for it.
      - EXPOSE_DOCS=true
    # Override the production CMD to also run the seed on every start.
    # `seed_data.py` is idempotent: it skips records that already exist.
    # The `migrate` service has already brought the schema to head.
    command: >
      sh -c "python seed_data.py
      && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      # Live-reload backend code in dev (uvicorn --reload picks up changes).
      # Uploads stay in the base file's uploads_data volume, mounted over
      # /app/uploads: a host directory bind-mounted there is owned by the
      # host user (or by root, if Docker creates it), and the backend runs as
      # uid 1001, so on Linux every upload would fail with permission denied.
      - ./backend:/app

  frontend:
    restart: "no"
    build:
      args:
        # Baked into the bundle at build time — see frontend/Dockerfile.
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}

  db:
    restart: "no"
    # Publish DB port to the host for local debugging (psql, DBeaver, etc.).
    # DB_PORT in a root .env moves it off 5432, e.g. when a PostgreSQL
    # installed on the host already listens there.
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=pathology_dev
      - POSTGRES_PASSWORD=dev_password_change_me
      - POSTGRES_DB=pathology_lis
      # Dev placeholder — init-db.sh skips role creation if this is empty.
      - LIS_APP_PASSWORD=dev_lis_app_rw_change_me
