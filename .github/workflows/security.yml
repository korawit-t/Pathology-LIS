name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday 02:00 UTC
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: |
          grep -vE "^openslide" backend/requirements.txt > /tmp/requirements_for_audit.txt
          pip-audit -r /tmp/requirements_for_audit.txt --ignore-vuln PYSEC-2022-43012 --ignore-vuln CVE-2024-23342

  python-sast:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run bandit
        # his_adapters stays excluded: its raw-SQL sites are multiline f-strings that
        # can't carry a working inline `# nosec`. Semgrep (below) scans that folder instead;
        # the real fix is the bindparam(expanding=True) refactor (audit H5/M4).
        run: bandit -r backend/app -ll -x backend/app/tests,backend/app/his_adapters

  node-audit:
    name: Node Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run npm audit (high/critical, minus accepted-risk advisories)
        working-directory: frontend
        run: |
          # Advisories intentionally accepted as risk instead of fixed — see
          # comment above each ID. Remove the entry once a real fix lands
          # upstream so the audit picks it back up.
          ALLOWED_ADVISORIES=(
            # React Router "RSC Mode" CSRF bypass. Not exploitable here —
            # this is a client-only Vite SPA, no RSC/server actions in use.
            # No non-breaking fix exists yet upstream: the only "fixed"
            # version npm offers is 7.11.0, a downgrade that reintroduces 14
            # other high-severity CVEs already patched in the version we're
            # on. https://github.com/advisories/GHSA-qwww-vcr4-c8h2
            "GHSA-qwww-vcr4-c8h2"
          )

          npm audit --audit-level=high --json > audit.json || true

          ALLOWED_JSON=$(printf '%s\n' "${ALLOWED_ADVISORIES[@]}" | jq -R . | jq -s .)
          UNALLOWED=$(jq -r --argjson allowed "$ALLOWED_JSON" '
            [.vulnerabilities[]?
              | select(.severity == "high" or .severity == "critical")
              | .via[]?
              | select(type == "object")
              | .url
              | capture("advisories/(?<id>GHSA-[a-zA-Z0-9-]+)").id
            ]
            | unique
            | map(select(. as $id | ($allowed | index($id)) | not))
            | .[]
          ' audit.json)

          if [ -n "$UNALLOWED" ]; then
            echo "Found high/critical advisories not on the accepted-risk allowlist:"
            echo "$UNALLOWED"
            exit 1
          fi
          echo "No unallowed high/critical severity advisories found."

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install semgrep
        run: pip install semgrep
      # Covers FastAPI + React that bandit rules miss. `--error` = fail on findings.
      # avoid-sqlalchemy-text is excluded: it flags EVERY text() call regardless of
      # parameterization (all our text() use bound :params + carry # nosec B608), so
      # it is pure noise here; bandit B608 + review still cover raw f-string SQL.
      # Individual react-dangerouslysetinnerhtml sites are suppressed inline where the
      # input is DOMPurify-sanitized, keeping the rule live for any NEW unsanitized use.
      - name: Run semgrep
        run: |
          semgrep scan \
            --config p/python \
            --config p/javascript \
            --config p/react \
            --config p/secrets \
            --error --metrics off \
            --exclude-rule python.sqlalchemy.security.audit.avoid-sqlalchemy-text.avoid-sqlalchemy-text \
            --exclude frontend/node_modules \
            --exclude backend/.venv \
            --exclude backend/venv
